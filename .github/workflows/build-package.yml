name: Build Package

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build package via Makefile
      run: make package

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: termux-shizuku-tools.deb
        path: termux-shizuku-tools.deb